---
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused, plus the checks below.
  default: standard
  enable:
    - bodyclose
    - canonicalheader
    - contextcheck
    - errchkjson
    - errname
    - errorlint
    - exptostd
    - forcetypeassert
    - gocritic
    - godot
    - gosec
    - intrange
    - misspell
    - nilerr
    - nilnil
    - nolintlint
    - noctx
    - perfsprint
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
  settings:
    misspell:
      locale: US
  exclusions:
    rules:
      # Tests write fixtures to temporary directories and drive fake servers, where the file and request hardening
      # gosec asks for protects nothing.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/antilax-3/docker-readmesync
...
